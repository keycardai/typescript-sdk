name: Socket Fix

on:
  schedule:
    - cron: "17 6 * * 1,4" # Mon + Thu 6:17am UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Socket Fix
        env:
          SOCKET_CLI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOCKET_CLI_API_TOKEN: ${{ secrets.SOCKET_API_TOKEN }}
          SOCKET_CLI_GIT_USER_NAME: github-actions[bot]
          SOCKET_CLI_GIT_USER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: pnpm dlx @socketsecurity/cli fix --autopilot
