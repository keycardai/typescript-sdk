name: Bump Package Version

on:
  workflow_call:
    inputs:
      package_name:
        required: true
        type: string
        description: "Name of the package to bump (e.g., keycardai-oauth)"
      package_dir:
        required: true
        type: string
        description: "Directory of the package (e.g., packages/oauth)"

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      # New package.json version after `cz bump` runs, e.g. "0.4.0".
      # Empty when no bump was needed (no unreleased commits for this package).
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Tag pushed by `cz bump` must come from a real user identity, not
          # GITHUB_TOKEN, so that the resulting `push: tags` event triggers
          # `publish.yml` and its OIDC claims match the npm trusted publisher.
          # Tags pushed by GITHUB_TOKEN do not fire downstream workflows.
          token: ${{ secrets.RELEASE_GITHUB_PAT }}
          fetch-depth: 0

      - name: Install commitizen
        run: pip install commitizen

      - name: Bump version for ${{ inputs.package_name }}
        id: bump
        run: |
          python scripts/bump_package.py "${{ inputs.package_name }}" "${{ inputs.package_dir }}"
          NEW_VERSION=$(python3 -c "import json; print(json.load(open('${{ inputs.package_dir }}/package.json'))['version'])")
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Bumped ${{ inputs.package_name }} to $NEW_VERSION"
