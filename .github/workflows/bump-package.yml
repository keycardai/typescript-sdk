name: Bump Package Version

on:
  workflow_call:
    inputs:
      package_name:
        required: true
        type: string
        description: "Name of the package to bump (e.g., keycardai-oauth)"
      package_dir:
        required: true
        type: string
        description: "Directory of the package (e.g., packages/oauth)"
      target_branch:
        required: false
        type: string
        default: main
        description: "Branch that receives the bump PR"
      increment:
        required: false
        type: string
        default: auto
        description: "Optional forced increment: major, minor, or patch"
  workflow_dispatch:
    inputs:
      package_name:
        required: true
        type: string
      package_dir:
        required: true
        type: string
      target_branch:
        required: false
        type: string
        default: main
      increment:
        required: false
        type: choice
        default: auto
        options:
          - auto
          - major
          - minor
          - patch

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SDK_RELEASE_APP_ID }}
          private-key: ${{ secrets.SDK_RELEASE_PRIVATE_KEY }}

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 0

      - name: Install commitizen
        run: pip install commitizen

      - name: Bump version for ${{ inputs.package_name }}
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          ARGS=(--target-branch "${{ inputs.target_branch }}")
          if [[ "${{ inputs.increment }}" != "auto" ]]; then
            ARGS+=(--increment "${{ inputs.increment }}")
          fi
          python scripts/bump_package.py "${{ inputs.package_name }}" "${{ inputs.package_dir }}" "${ARGS[@]}"
