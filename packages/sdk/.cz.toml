[tool.commitizen]
name = "cz_customize"
version = "2.0.0"
version_files = ["package.json:version"]
tag_format = "${version}-keycardai-sdk"
ignored_tag_formats = ["${version}-*"]
update_changelog_on_bump = true
bump_message = "bump: keycardai-sdk $current_version → $new_version"
# Past 1.0.0: breaking changes must cut majors. Left true, cz derived 1.1.0
# from the feat! v2-cutover commit and it nearly published into the 1.x line.
major_version_zero = false

[tool.commitizen.customize]
changelog_pattern = "^(feat|fix|refactor|perf|test|build|ci|revert)\\(sdk\\)(!)?:"
# Increment detection is scope-local: commits for other packages match
# nothing here, so they cannot move this package's version.
bump_pattern = "^((BREAKING[\\-\\ ]CHANGE|feat|fix|refactor|perf)\\(sdk\\)!?):"

[tool.commitizen.customize.bump_map]
"^.+!$" = "MAJOR"
"^BREAKING[\\-\\ ]CHANGE" = "MAJOR"
"^feat" = "MINOR"
"^fix" = "PATCH"
"^refactor" = "PATCH"
"^perf" = "PATCH"

[tool.commitizen.customize.bump_map_major_version_zero]
"^.+!$" = "MINOR"
"^BREAKING[\\-\\ ]CHANGE" = "MINOR"
"^feat" = "MINOR"
"^fix" = "PATCH"
"^refactor" = "PATCH"
"^perf" = "PATCH"
